server {
    server_name files.13.140.40.247.nip.io;

    # Resumes are PDFs and go straight to the object store, not through the API.
    client_max_body_size 50m;

    # A dedicated host, NOT a path on the main site: presigned S3 URLs sign the host AND the path,
    # and SeaweedFS revalidates both. A /files/ prefix would either be stripped (path no longer
    # matches the signature) or kept (SeaweedFS reads "files" as the bucket). Neither works.
    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/13.140.40.247.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/13.140.40.247.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = files.13.140.40.247.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name files.13.140.40.247.nip.io;
    return 404; # managed by Certbot


}