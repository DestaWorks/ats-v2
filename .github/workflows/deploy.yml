name: Deploy

# Deployment is deliberately separate from PR validation (SAAS-RESTRUCTURE-PLAN Phase 3), and
# deliberately manual: nothing here is triggered by a push. A human dispatches it with the exact
# revision CI already passed.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The immutable revision to deploy — a full commit SHA that CI has passed."
        required: true
        type: string
      environment:
        description: "Target environment."
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # apps/api is a long-lived process, which is the whole reason it left serverless
  # (SAAS-RESTRUCTURE-PLAN 4.4). This job is the gate rather than the shipper: it proves the
  # pinned revision boots, serves and shuts down cleanly BEFORE any image is published from it,
  # so a broken revision never reaches a registry.
  api-artifact:
    name: Build the API from ${{ inputs.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      - name: Build the bundle
        run: pnpm build:api

      # A bundle that compiles is not a bundle that runs: externalised native deps and Pino's
      # transport worker both fail at import, not at build. Booting it here is what catches that.
      - name: Smoke-test the artefact
        env:
          NODE_ENV: production
          LOG_PRETTY: "0"
          API_PORT: "3004"
          DATABASE_URL: postgresql://smoke:smoke@127.0.0.1:5432/smoke
          DIRECT_URL: postgresql://smoke:smoke@127.0.0.1:5432/smoke
          # Throwaway, and deliberately not a secret: this proves the process starts, and it never
          # reaches a database or signs anything. Better Auth refuses to boot on its built-in
          # default, which is the check working as intended.
          BETTER_AUTH_SECRET: smoke-test-only-not-a-real-credential
        run: |
          set -euo pipefail
          node apps/api/dist/main.js & pid=$!
          # LIVENESS, not readiness. There is no Postgres in this runner, so `/health` answers 503
          # by design and `curl -fsS` would fail on it forever; `/health/live` is the endpoint that
          # answers `{"status":"ok"}` and proves what this step is actually for — the artefact
          # boots, resolves its externalised native deps, and routes.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3004/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3004/health/live | tee /dev/stderr | grep -q '"status":"ok"'

          # The reason production runs node rather than tsx: under tsx the runner killed the
          # process on SIGTERM before the handler drained, so a rolling deploy reset live requests.
          kill -TERM "$pid"
          for _ in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "API shut down gracefully on SIGTERM"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not exit within 20s of SIGTERM — shutdown is not graceful."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ inputs.ref }}
          path: apps/api/dist/
          retention-days: 14

  # Publish the containers. A registry is not a host: this stays correct whichever machine
  # eventually pulls them, which is the open decision. Tagged with the immutable SHA, never
  # `latest`, so what runs is always identifiable and a rollback is a tag change.
  #
  # NEXT_PUBLIC_API_URL is a BUILD argument, not runtime env — it is inlined into the browser
  # bundle and fixes the CSP `connect-src` origin, so the web image is per-environment and a
  # wrong value means rebuilding rather than restarting.
  images:
    name: Publish images (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: api-artifact
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the browser-facing API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is not set for this environment — the web image would be built with a blank API origin and every browser call would be CSP-blocked."
            exit 1
          fi

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository }}/migrate:${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ inputs.ref }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: admin
        uses: docker/build-push-action@v6
        with:
          context: .
          target: admin
          push: true
          tags: ghcr.io/${{ github.repository }}/admin:${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Schema before code. `prisma migrate deploy` applies only committed migrations and never
  # generates, resets or drops anything; it takes an advisory lock, so a re-run or a concurrent
  # dispatch waits rather than racing. It runs as its own job, deliberately host-neutral — the
  # host is a separate decision, and wherever it lands this step is the same.
  #
  # DIRECT_URL, not DATABASE_URL: a transaction pooler supports neither the advisory lock nor the
  # prepared statements migrations use. Failing here leaves the previous version serving the
  # previous schema, which is the safe direction.
  migrate:
    name: Apply migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: api-artifact
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      - name: Apply migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL}" ]; then
            echo "::error::DIRECT_URL is not set — the deploy would ship code against an unmigrated database."
            exit 1
          fi
          pnpm db:deploy

      - name: Report what is applied
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:status

  # The images are already published, so "deploy" here is: tell the host to pull this exact tag,
  # then wait until it is actually serving. Without the wait a green workflow would only mean "the
  # request was accepted", which is the failure mode where a broken API is reported as deployed.
  deploy-api:
    name: Roll out the API (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [images, migrate]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      # Whatever pulls the new tag — a platform webhook, a self-hosted runner, an agent on the
      # box — is reached through one generic URL, so choosing the host does not mean editing this
      # workflow. It fails loudly when unset rather than skipping, because a skipped rollout that
      # reports success is the failure mode this whole file exists to prevent.
      - name: Tell the host to roll out this revision
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::error::DEPLOY_HOOK_URL is not set — the API would silently not deploy. It must trigger a pull of ghcr.io/${{ github.repository }}/api:${{ inputs.ref }}"
            exit 1
          fi
          curl -fsS "${HOOK}?ref=${{ inputs.ref }}" > /dev/null
          echo "Asked the host to roll out ${{ inputs.ref }}"

      # The API is the read path for every ported page, so a web deploy on top of an API that is
      # not yet serving shows users an error boundary. Block until /health answers.
      # API_HEALTH_URL must point at READINESS — `https://<api-host>/health` — never at
      # `/health/live`. Liveness only proves the process is routing, which it does perfectly well
      # with an unreachable database or unapplied migrations; readiness is what distinguishes a
      # deploy that works from one that merely started. `{"ok":true,...}` is that endpoint's body.
      - name: Wait for the API to serve this revision
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_HEALTH_URL}" ]; then
            echo "::error::API_HEALTH_URL is not set — cannot confirm the API came back up."
            exit 1
          fi
          for _ in $(seq 1 60); do
            if curl -fsS "${API_HEALTH_URL}" | grep -q '"ok":true'; then
              echo "API is serving"
              exit 0
            fi
            sleep 10
          done
          echo "::error::API did not report healthy within 10 minutes."
          exit 1

  deploy:
    name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # After the API, never beside it: apps/web renders through it, so shipping web first would
    # serve the error boundary until the API caught up.
    needs: deploy-api
    # Attach GitHub environment protection rules (required reviewers for production) here.
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Same revision, same checks. A tag or branch name could move between the CI run and the
      # deploy; a SHA cannot, so the deployable unit is pinned to one.
      - name: Require a full commit SHA
        run: |
          set -euo pipefail
          if ! printf '%s' "${{ inputs.ref }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'${{ inputs.ref }}' is not a full 40-character commit SHA."
            exit 1
          fi

      # The gate this workflow exists to honour: build only what the pipeline already passed.
      - name: Require green CI on this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusions=$(gh api "repos/${{ github.repository }}/commits/${{ inputs.ref }}/check-runs" \
            --jq '.check_runs[] | select(.name | IN("Commit messages","Static analysis","Tests","Build")) | "\(.name)=\(.conclusion)"')
          echo "${conclusions}"
          for required in "Commit messages" "Static analysis" "Tests" "Build"; do
            if ! printf '%s\n' "${conclusions}" | grep -qx "${required}=success"; then
              echo "::error::Required check '${required}' is not green on ${{ inputs.ref }}."
              exit 1
            fi
          done

      # The images were published by `images` and the API is already serving, so this is the
      # front-end half of the same rollout: tell the host to pull the web and admin tags.
      - name: Roll out the web and admin containers
        id: deploy
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_WEB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::error::DEPLOY_HOOK_WEB_URL is not set — the web and admin containers would silently not deploy. It must trigger a pull of ghcr.io/${{ github.repository }}/web:${{ inputs.ref }} and .../admin:${{ inputs.ref }}"
            exit 1
          fi
          curl -fsS "${HOOK}?ref=${{ inputs.ref }}" > /dev/null
          echo "url=${{ vars.WEB_URL }}" >> "$GITHUB_OUTPUT"
          echo "Asked the host to roll out web + admin at ${{ inputs.ref }}"

      # A rollout that was accepted is not a rollout that serves.
      - name: Wait for the web app to answer
        env:
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_HEALTH_URL}" ]; then
            echo "::error::WEB_HEALTH_URL is not set — cannot confirm the web app came back up."
            exit 1
          fi
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "${WEB_HEALTH_URL}"; then
              echo "Web is serving"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Web did not answer within 10 minutes."
          exit 1

      # "Nothing currently records what is live" — SAAS-RESTRUCTURE-PLAN, Deploy tags. This is
      # the answer to "roll back to what?".
      - name: Tag the deployed revision
        run: |
          set -euo pipefail
          tag="deploy/${{ inputs.environment }}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          git tag -a "${tag}" "${{ inputs.ref }}" -m "Deployed to ${{ inputs.environment }}: ${{ steps.deploy.outputs.url }}"
          git push origin "${tag}"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Revision | \`${{ inputs.ref }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
