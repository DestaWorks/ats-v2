name: CI

# PR validation only. Deployment is a separate workflow (deploy.yml) that builds from a
# revision this pipeline has already passed — see SAAS-RESTRUCTURE-PLAN Phase 3.
on:
  push:
    branches: [main, staging, restructure]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep the task cache where the Actions cache step restores it.
  TURBO_CACHE_DIR: .turbo
  # Turborepo's `--affected` diffs against this ref to decide which packages changed, so
  # unaffected packages are neither rebuilt nor retested. `fetch-depth: 0` guarantees the ref
  # resolves — turbo hard-errors on an unknown revision.
  #
  # Only on a pull request. On a push the base would be the pushed branch itself, an empty diff
  # that would mark every job green having run nothing; those runs execute the full set and lean
  # on the task cache the PR run already populated.
  #
  # The plain `pnpm lint` / `pnpm build` scripts stay affected-free on purpose: Vercel builds
  # from an uploaded source tree with no git history to diff against.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
  TURBO_AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  # A husky commit-msg hook is bypassable with `--no-verify`. This is not.
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      # The PR head, not the synthetic merge commit `pull_request` checks out by default, so the
      # linted range is exactly the commits this PR contributes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every commit that this change would put on the branch, not just the tip. The merge
      # commit's own subject is generated by GitHub ("Merge pull request #N from …") and is
      # deliberately not linted; what lands in history is the range below.
      - name: Conventional Commits over the incoming range
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base revision (first push to this branch); linting HEAD only."
            pnpm exec commitlint --from "HEAD~1" --to HEAD --verbose
          else
            pnpm exec commitlint --from "${BASE}" --to HEAD --verbose
          fi

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm exec turbo run //#app:lint ${{ env.TURBO_AFFECTED }}

      - name: Typecheck
        run: pnpm exec turbo run //#app:typecheck ${{ env.TURBO_AFFECTED }}

      # One dependency, one version, workspace-wide. Runs before the architecture gate so a
      # version split is reported as itself rather than as a downstream graph error.
      - name: Dependency-graph validation
        run: pnpm exec turbo run //#app:deps-check ${{ env.TURBO_AFFECTED }}

      # Owned by the architecture-checks workstream: dependency direction, the forbidden-import
      # list, cycles, Prisma containment, `apps/* -> db|application`. Assumed script name
      # `arch:check`; if that workstream names it differently, this one line changes.
      - name: Architecture checks
        run: pnpm arch:check

      # Four indexes exist only in hand-written migration SQL, because Prisma's DSL cannot express
      # them. `prisma migrate dev` reads them as drift and proposes dropping them — which has
      # already happened three times to the trigram indexes. The fourth, the partial unique on
      # lower(email), is the ONLY guard against importing the same lead twice and has no restore
      # migration behind it. This replays every migration in order and fails if one is missing,
      # moved, or no longer tenant-leading.
      - name: Raw-SQL index survival
        run: pnpm raw-index:check

      # Phase 6.6/6.7, the half that needs no database: every tenant-scoped model in the schema is
      # in the canonical list, has ENABLE + FORCE + a policy in the RLS migration, and no global
      # model has quietly acquired a tenant. Runs here rather than in the isolation job so a
      # forgotten table is reported in seconds, by name, before a container is even started.
      - name: RLS coverage
        run: pnpm rls:check

      # The cross-cutting half of the Phase 4.3 auth review. Per-route tests assert 401/403 for one
      # endpoint at a time; this asserts, over all of them at once, that no capability was widened,
      # dropped or swapped between a Next route and the controller replacing it, and that every
      # endpoint sits behind the right guard. It carries floors, so a parser that stops matching
      # fails loudly instead of reporting a clean surface it never inspected.
      - name: Auth-surface parity
        run: pnpm auth:check

      # Phase 6.3's done-when, made enforceable: no repository method may query without a
      # TenantContext, the allowlist of repositories that legitimately do is checked against the
      # seam's own GLOBAL_MODELS rather than trusted, and the escape hatches that let un-threaded
      # callers through are ratcheted so they can only shrink. Carries scale floors, so a parser
      # that stops matching fails instead of reporting a layer it never inspected.
      - name: Tenant-scope enforcement
        run: pnpm tenant:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Unit and integration tests. Vitest runs them in one pass; they are named separately
      # here because the definition of done names them separately.
      - name: Unit and integration tests
        run: pnpm exec turbo run //#app:test ${{ env.TURBO_AFFECTED }}

      # Named gates. Both are inside the suite above, but a rule nobody can point at in the
      # pipeline is the failure mode this phase exists to end — so each gets its own step.
      - name: Contract tests
        run: pnpm exec turbo run //#app:test-contract ${{ env.TURBO_AFFECTED }}

      - name: Log check — no PII/PHI field name in a log call
        run: pnpm exec turbo run //#app:test-logs ${{ env.TURBO_AFFECTED }}

  # Phase 6.7 — proof of isolation, on every PR.
  #
  # This job exists because "isolation is enforced" is a claim about a database, and a suite that
  # mocked one would prove nothing about the database we run. So it gets a real Postgres: a
  # throwaway service container, created for this run and destroyed with it, never a shared or
  # hosted database. The schema is built by replaying the migration SQL (scripts/apply-migrations.mjs,
  # which refuses any host that is not loopback) rather than by the Prisma CLI, so there is no
  # configuration under which this job could point at production.
  #
  # It is deliberately NOT `--affected`. Isolation is a property of the whole schema; a change
  # anywhere in the graph can undo it, and "we did not think that package was involved" is exactly
  # how a cross-tenant leak ships.
  isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: destaworks_isolation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The suite connects as an unprivileged role that the bootstrap creates and hands the tables
      # to — policies do not apply to a superuser, and the suite asserts its own role is neither
      # superuser nor BYPASSRLS before trusting a single result.
      - name: Seed two tenants and prove A cannot read B, per table
        env:
          ISOLATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/destaworks_isolation
        run: pnpm app:test-isolation

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm exec turbo run //#app:build ${{ env.TURBO_AFFECTED }}

      - name: Build the platform-admin console
        run: pnpm exec turbo run //#admin:build ${{ env.TURBO_AFFECTED }}

  # Playwright coverage of the four critical flows (docs/STACK-ARCHITECTURE.md,
  # docs/CONVENTIONS.md §10): sign-in, add/move candidate, promote lead, parse resume.
  #
  # Same shape as `isolation` — its own throwaway `postgres:16` service container, never a shared
  # or hosted database — but the schema is built with `prisma migrate deploy` (what a real deploy
  # runs) rather than the isolation job's raw-SQL replay, since this job isn't proving anything
  # about the migration mechanism itself. `apps/web` and `apps/api` are started as real dev
  # servers (the same `pnpm dev:web` / `pnpm dev:api` a developer runs locally) and Playwright
  # drives a real signed-in browser session against them.
  #
  # Resume extraction is mocked at the network layer inside the spec (`page.route`), so no
  # `ANTHROPIC_API_KEY` secret is needed here — `ANTHROPIC_API_KEY` below is a dummy value that
  # only satisfies the app's "is AI configured" presence check, never a real call.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: destaworks_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/destaworks_e2e
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/destaworks_e2e
      BETTER_AUTH_URL: http://localhost:3007
      BETTER_AUTH_SECRET: e2e-ci-only-not-a-real-secret
      API_URL: http://localhost:3004
      NEXT_PUBLIC_API_URL: http://localhost:3004
      WEB_ORIGINS: http://localhost:3007
      ANTHROPIC_API_KEY: e2e-ci-only-dummy-key
      SEED_OWNER_EMAIL: owner@e2e.local
      SEED_OWNER_PASSWORD: E2eOwnerPass123!
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed the Owner
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the critical-flow specs
        run: pnpm app:test-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
